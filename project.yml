# XcodeGen spec for the Tamp app. Generate the project with `xcodegen generate`;
# Tamp.xcodeproj is not committed.
name: Tamp
options:
  bundleIdPrefix: io.github.solbitple12
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TampCore:
    path: TampCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tamp:
    type: application
    platform: macOS
    sources:
      - path: App/Tamp
    dependencies:
      - package: TampCore
        product: TampCore
    settings:
      base:
        PRODUCT_NAME: Tamp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.solbitple12.Tamp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tamp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Developer ID outside the App Store: hardened runtime on, no sandbox.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # Signs for this Mac only by default. scripts/release.sh passes the
        # Developer ID identity and team instead (docs/signing-and-notarization.md).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # The helper script reads build/helpers, outside the sandboxed script inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          # No get-task-allow entitlement: notarization rejects it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      - name: Bundle helpers
        script: '"$SRCROOT/scripts/bundle-helpers.sh"'
        basedOnDependencyAnalysis: false
    scheme: {}
