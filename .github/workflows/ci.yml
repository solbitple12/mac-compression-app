name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: TampCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Restore built helpers
        uses: actions/cache@v4
        with:
          path: build/helpers
          key: helpers-${{ runner.os }}-${{ hashFiles('scripts/build-helpers.sh', 'scripts/patches/**') }}
      - name: Build helpers
        run: scripts/build-helpers.sh
      - name: Build and test TampCore
        env:
          TAMP_HELPERS_DIR: ${{ github.workspace }}/build/helpers/bin
          TAMP_REQUIRE_HELPERS: "1"
        run: swift test --package-path TampCore

  app-build:
    name: App build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore built helpers
        uses: actions/cache@v4
        with:
          path: build/helpers
          key: helpers-${{ runner.os }}-${{ hashFiles('scripts/build-helpers.sh', 'scripts/patches/**') }}
      - name: Build helpers
        run: scripts/build-helpers.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build Tamp
        run: >
          xcodebuild -project Tamp.xcodeproj -scheme Tamp -configuration Debug
          -destination 'platform=macOS' -derivedDataPath build/DerivedData build
      - name: Check the bundle
        run: |
          source scripts/helper-list.sh
          app=build/DerivedData/Build/Products/Debug/Tamp.app
          for tool in "${TAMP_HELPERS[@]}"; do
            test -x "$app/Contents/Helpers/$tool"
            codesign --verify --strict "$app/Contents/Helpers/$tool"
          done
          ls "$app/Contents/Resources/Licenses"
          for license in "${TAMP_LICENSES[@]}"; do
            test -s "$app/Contents/Resources/Licenses/$license"
          done
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Launch Tamp
        run: |
          app=build/DerivedData/Build/Products/Debug/Tamp.app
          "$app/Contents/MacOS/Tamp" &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0; wait "$pid" || status=$?
            echo "Tamp exited during launch with status $status"; exit 1
          fi
          kill "$pid"

  ui-smoke:
    name: UI smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore built helpers
        uses: actions/cache@v4
        with:
          path: build/helpers
          key: helpers-${{ runner.os }}-${{ hashFiles('scripts/build-helpers.sh', 'scripts/patches/**') }}
      - name: Build helpers
        run: scripts/build-helpers.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Allow UI automation
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Make the folder to compress
        # The test corpus plus what git can't hold: an empty folder, a script
        # with its executable bit and a symlink. /tmp needs no privacy approval.
        run: |
          rm -rf /tmp/tamp-ui
          mkdir -p /tmp/tamp-ui
          cp -R TampCore/Tests/TampCoreTests/Corpus /tmp/tamp-ui/Project
          mkdir "/tmp/tamp-ui/Project/documents/empty folder" /tmp/tamp-ui/Project/tools
          printf '#!/bin/sh\necho hello\n' >/tmp/tamp-ui/Project/tools/run.sh
          chmod 755 /tmp/tamp-ui/Project/tools/run.sh
          ln -s run.sh /tmp/tamp-ui/Project/tools/latest
      - name: Compress and extract through the window
        env:
          TEST_RUNNER_TAMP_UI_FIXTURE: /tmp/tamp-ui
        run: >
          xcodebuild -project Tamp.xcodeproj -scheme Tamp -configuration Debug
          -destination 'platform=macOS' -derivedDataPath build/DerivedData
          -resultBundlePath build/UITests.xcresult test
      - name: Check the files on disk
        run: |
          ls -la /tmp/tamp-ui
          test -s /tmp/tamp-ui/Project.tar.zst
          # The extracted copy lands beside the original as "Project 2".
          diff -r /tmp/tamp-ui/Project "/tmp/tamp-ui/Project 2"
          test -x "/tmp/tamp-ui/Project 2/tools/run.sh"
          test "$(readlink "/tmp/tamp-ui/Project 2/tools/latest")" = run.sh
          test -d "/tmp/tamp-ui/Project 2/documents/empty folder"
          echo "The extracted folder matches the original."
      - name: Export the screenshots
        if: always()
        # Printed as base64 too, so they can be read from the log.
        run: |
          test -d build/UITests.xcresult || exit 0
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          jq -r '.[].attachments[] | "\(.exportedFileName)\t\(.suggestedHumanReadableName)"' build/screenshots/manifest.json \
            || cat build/screenshots/manifest.json
          for png in build/screenshots/*.png; do
            jpg="${png%.png}.jpg"
            sips -Z 1100 -s format jpeg -s formatOptions 70 "$png" --out "$jpg" >/dev/null
            echo "SCREENSHOT-BEGIN $(basename "$png")"
            base64 -i "$jpg" -b 2000
            echo "SCREENSHOT-END"
          done
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: build/screenshots
          if-no-files-found: ignore

  release-dry-run:
    name: Release dry run
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore built helpers
        uses: actions/cache@v4
        with:
          path: build/helpers
          key: helpers-${{ runner.os }}-${{ hashFiles('scripts/build-helpers.sh', 'scripts/patches/**') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build a Release app and run the notarization checks
        run: scripts/release.sh --dry-run
