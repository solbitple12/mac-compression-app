name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: TampCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build and test TampCore
        run: swift test --package-path TampCore
